[project]
name = "vocacional-backend"
version = "0.1.0"
description = "Backend FastAPI del Sistema de Orientación Vocacional UNA Puno"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# B008: Depends(...) en los defaults de los parámetros es el patrón idiomático
# de FastAPI (recomendado en su propia documentación), no un bug real.
ignore = ["B008"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
